<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#245B9C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TMS Mobile</title>
<style>
:root{--pri:#245B9C;--bg:#f4f7fb;--ink:#1f2937;--mut:#64748b;--line:#e2e8f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}
#net{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
main{padding:14px;max-width:560px;margin:auto}
.hide{display:none!important}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
h2{font-size:16px;margin-bottom:12px;color:#1e3f70}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}
input:focus,select:focus{outline:2px solid #9cc2e5;border-color:var(--pri)}
button{height:46px;padding:0 16px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:15px;font-weight:600;width:100%;margin-top:10px}
button.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
button.sm{height:34px;font-size:13px;width:auto;margin:0}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{font-size:13px;color:var(--mut);margin-top:6px}
.warn{background:#fef3c7;color:#92400e;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.bad{background:#fee2e2;color:#991b1b;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.sug{border:1px solid var(--line);border-radius:8px;margin-top:4px;background:#fff;max-height:200px;overflow:auto}
.sug div{padding:12px;border-bottom:1px solid var(--line)}
.mp label{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:400;margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.mp input{width:20px;height:20px}
.pos{border-left:4px solid var(--pri)}
.pos h3{font-size:15px;display:flex;justify-content:space-between}
.pos small{font-weight:400;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.q{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.st{font-weight:600;font-size:12px}
.PENDING{color:var(--mut)}.SENDING{color:var(--warn)}.FAILED{color:var(--bad)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#1e293b;color:#fff;padding:12px;border-radius:8px;font-size:14px;z-index:9;text-align:center}
</style>
</head>
<body>

<header>
  <b>TMS Mobile</b>
  <span id="net">...</span>
</header>

<main>

<!-- LOGIN -->
<section id="sLogin" class="hide">
  <div class="card">
    <h2>Login</h2>
    <div id="loginNote" class="warn hide"></div>
    <label>Username</label><input id="lu" autocapitalize="none" autocomplete="username">
    <label>Password</label><input id="lp" type="password" autocomplete="current-password">
    <button id="bLogin" onclick="doLogin()">Login</button>
    <p class="note">Login pertama wajib online. Setelah itu aplikasi bisa dibuka tanpa sinyal.</p>
  </div>
</section>

<!-- HOME -->
<section id="sHome" class="hide">
  <div class="card">
    <h2 id="hUser">-</h2>
    <div id="hStale"></div>
    <p class="note" id="hPkg">-</p>
    <button onclick="openSession()">Mulai Monitoring</button>
    <button class="sec" id="bPull" onclick="pullData()">Sinkron Data Terbaru</button>
  </div>
  <div class="card">
    <h2>Antrian Upload <span id="qCount"></span></h2>
    <div id="qList"></div>
    <button class="sec" onclick="runQueue(true)">Kirim Sekarang</button>
  </div>
  <button class="sec" onclick="logout()">Logout</button>
</section>

<!-- SESI -->
<section id="sSession" class="hide">
  <div class="card">
    <h2>Sesi Monitoring</h2>
    <label>Tanggal</label><input id="sd" type="date">
    <label>Shift</label>
    <select id="ss"><option value="">Pilih shift</option><option>Pagi</option><option>Malam</option></select>
    <label>Manpower</label>
    <div class="mp" id="sm"></div>
    <button onclick="startSession()">Mulai</button>
    <button class="sec" onclick="show('sHome')">Kembali</button>
  </div>
</section>

<!-- UNIT -->
<section id="sUnit" class="hide">
  <div class="card">
    <h2 id="uHead">-</h2>
    <label>Unit</label>
    <input id="uu" placeholder="Cari unit..." autocomplete="off" oninput="suggestUnit(this.value)">
    <div id="usug" class="sug hide"></div>
    <label>HM Unit</label>
    <input id="uh" type="number" inputmode="numeric" placeholder="HM Unit" oninput="recalc()">
    <button onclick="loadTyres()">Muat Ban</button>
  </div>
  <div id="tyres"></div>
  <div id="uAct" class="hide">
    <button onclick="saveUnit()">Simpan &amp; Unit Berikutnya</button>
    <button class="sec" onclick="cancelUnit()">Batal</button>
  </div>
  <button class="sec" onclick="endSession()">Selesai Sesi</button>
</section>

</main>

<div id="toast" class="hide"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxhXu0V7Klf5kTfxqYSCvZvVKtsjeO4hoGrQhQWw5t3ZQkd49grk_LaEjWb2obmsIVD9w/exec";
const S = { token: "", user: null, pkg: null, session: null, unit: null, running: false };

/* ---------- penyimpanan lokal (IndexedDB) ---------- */
function db() {
  return new Promise((ok, no) => {
    const r = indexedDB.open("tms-mobile", 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("kv");
      r.result.createObjectStore("q", { keyPath: "id", autoIncrement: true });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}
function tx(store, mode, fn) {
  return db().then(d => new Promise((ok, no) => {
    const t = d.transaction(store, mode), rq = fn(t.objectStore(store));
    t.oncomplete = () => ok(rq && rq.result);
    t.onerror = () => no(t.error);
  }));
}
const kvGet = k => tx("kv", "readonly", s => s.get(k));
const kvSet = (k, v) => tx("kv", "readwrite", s => s.put(v, k));
const kvDel = k => tx("kv", "readwrite", s => s.delete(k));
const qAll = () => tx("q", "readonly", s => s.getAll());
const qPut = o => tx("q", "readwrite", s => s.put(o));
const qDel = id => tx("q", "readwrite", s => s.delete(id));

/* ---------- util ---------- */
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function show(id) {
  ["sLogin", "sHome", "sSession", "sUnit"].forEach(s => $(s).classList.toggle("hide", s !== id));
  window.scrollTo(0, 0);
  if (id === "sHome") renderHome();
}
let tt;
function toast(m) {
  const t = $("toast"); t.textContent = m; t.classList.remove("hide");
  clearTimeout(tt); tt = setTimeout(() => t.classList.add("hide"), 3000);
}
function netLabel() {
  const on = navigator.onLine;
  $("net").textContent = on ? "Online" : "Offline";
}
async function call(fn, args) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token: S.token, fn, args: args || [] })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
const isAuthErr = e => /belum login|sesi habis/i.test(e.message || "");

/* ---------- login & data ---------- */
async function doLogin() {
  if (!navigator.onLine) return toast("Login butuh koneksi internet.");
  const b = $("bLogin"); b.disabled = true; b.textContent = "Memproses...";
  try {
    const r = await call("loginUser", [$("lu").value, $("lp").value]);
    if (!r.success) throw new Error(r.message);
    S.token = r.token;
    S.user = { username: r.username, name: r.name, title: r.title, role: r.role };
    await kvSet("token", S.token);
    await kvSet("user", S.user);
    $("loginNote").classList.add("hide");
    if (!S.pkg) { await pullData(true); } else { show("sHome"); }
    runQueue();
  } catch (e) { toast(e.message); }
  b.disabled = false; b.textContent = "Login";
}

async function pullData(first) {
  if (!navigator.onLine) return toast("Tidak ada koneksi.");
  const b = $("bPull"); b.disabled = true; b.textContent = "Mengunduh...";
  try {
    S.pkg = await call("getOfflinePackage");
    await kvSet("pkg", S.pkg);
    toast("Data berhasil diunduh.");
    show("sHome");
  } catch (e) {
    if (isAuthErr(e)) needLogin("Sesi habis, login ulang.");
    else toast("Gagal: " + e.message);
  }
  b.disabled = false; b.textContent = "Sinkron Data Terbaru";
}

function needLogin(msg) {
  const n = $("loginNote"); n.textContent = msg; n.classList.remove("hide");
  if (S.user) $("lu").value = S.user.username || "";
  show("sLogin");
}

async function logout() {
  const q = (await qAll()).length;
  if (q && !confirm(q + " data belum terupload dan akan hilang. Tetap logout?")) return;
  for (const x of await qAll()) await qDel(x.id);
  await kvDel("token"); await kvDel("user"); await kvDel("pkg"); await kvDel("session");
  Object.assign(S, { token: "", user: null, pkg: null, session: null });
  show("sLogin");
}

/* ---------- beranda ---------- */
async function renderHome() {
  const u = S.user || {};
  $("hUser").textContent = (u.title ? u.title + ". " : "") + (u.name || "-") + " (" + (u.role || "-") + ")";
  const t = S.pkg && S.pkg.generatedAt ? new Date(S.pkg.generatedAt) : null;
  $("hPkg").textContent = t
    ? "Data diunduh: " + t.toLocaleString("id-ID") + " · " + S.pkg.units.length + " unit"
    : "Belum ada data.";
  const old = t && (Date.now() - t.getTime() > 24 * 3600 * 1000);
  $("hStale").innerHTML = old
    ? '<div class="warn">Data sudah lebih dari 24 jam. Sinkron ulang sebelum berangkat ke lapangan.</div>' : "";
  renderQueue();
}

async function renderQueue() {
  const all = await qAll();
  $("qCount").textContent = all.length ? "(" + all.length + ")" : "";
  $("qList").innerHTML = all.length === 0
    ? '<p class="note">Tidak ada data menunggu.</p>'
    : all.map(x => `
      <div class="q">
        <div><b>${esc(x.unit)}</b><br><span class="note">${esc(x.date)} · ${esc(x.shift)} · ${x.data.length} ban</span>
          ${x.error ? '<br><span class="note" style="color:#dc2626">' + esc(x.error) + "</span>" : ""}</div>
        <div style="text-align:right">
          <div class="st ${x.status}">${x.status === "PENDING" ? "Menunggu" : x.status === "SENDING" ? "Mengirim..." : "Gagal"}</div>
          ${x.status === "FAILED" ? `<button class="sm" onclick="retry(${x.id})">Ulangi</button>` : ""}
        </div>
      </div>`).join("");
}

async function retry(id) {
  const x = (await qAll()).find(i => i.id === id);
  if (!x) return;
  x.status = "PENDING"; x.error = ""; await qPut(x);
  runQueue(true);
}

/* ---------- sesi ---------- */
function openSession() {
  if (!S.pkg) return toast("Unduh data dulu.");
  $("sd").value = new Date().toISOString().slice(0, 10);
  $("sm").innerHTML = (S.pkg.manpower || []).map(n =>
    `<label><input type="checkbox" value="${esc(n)}"> ${esc(n)}</label>`).join("");
  show("sSession");
}

async function startSession() {
  const date = $("sd").value, shift = $("ss").value;
  const mp = [...document.querySelectorAll("#sm input:checked")].map(i => i.value).join(", ");
  if (!date) return toast("Pilih tanggal.");
  if (!shift) return toast("Pilih shift.");
  S.session = { date, shift, manpower: mp, saved: 0 };
  await kvSet("session", S.session);
  enterUnit();
}

function enterUnit() {
  const s = S.session;
  $("uHead").textContent = s.date + " · " + s.shift + " · " + s.saved + " unit tersimpan";
  cancelUnit();
  show("sUnit");
}

function endSession() {
  S.session = null; kvDel("session"); show("sHome");
}

/* ---------- unit & ban ---------- */
function suggestUnit(k) {
  const box = $("usug"); k = k.trim().toUpperCase();
  if (!k) { box.classList.add("hide"); return; }
  const r = S.pkg.units.filter(u =>
    (u.noLambung + " " + u.kodeUnit).toUpperCase().includes(k)).slice(0, 8);
  box.innerHTML = r.length
    ? r.map(u => `<div onclick="pickUnit('${esc(u.noLambung)}')">${esc(u.noLambung)} — ${esc(u.kodeUnit)}</div>`).join("")
    : "<div>Tidak ditemukan</div>";
  box.classList.remove("hide");
}
function pickUnit(n) {
  $("uu").value = n; $("usug").classList.add("hide"); $("uh").focus();
}

function loadTyres() {
  const unit = $("uu").value.trim();
  const hm = Number($("uh").value);
  if (!S.pkg.units.some(u => u.noLambung === unit)) return toast("Pilih unit dari daftar.");
  if (!$("uh").value || isNaN(hm)) return toast("Isi HM Unit.");
  const list = (S.pkg.tyres[unit] || []);
  if (!list.length) return toast("Tidak ada ban terpasang di unit ini.");
  S.unit = unit;
  $("tyres").innerHTML = list.map(t => `
    <div class="card pos" data-pos="${t.position}" data-sn="${esc(t.serialNumber)}"
         data-ihu="${t.installHmUnit}" data-iht="${t.installHmTyre}">
      <h3>P${t.position}<small>${esc(t.serialNumber)} ${esc(t.brand)}</small></h3>
      <label>HM Tyre (otomatis)</label><input class="f-hm" readonly>
      <div class="g2">
        <div><label>Tekanan Aktual</label><input class="f-pa" type="number" inputmode="decimal"></div>
        <div><label>Tekanan Tambah</label><input class="f-pd" type="number" inputmode="decimal"></div>
      </div>
      <div class="g3">
        <div><label>Temp Ban</label><input class="f-tt" type="number" inputmode="decimal"></div>
        <div><label>Temp Rim</label><input class="f-tr" type="number" inputmode="decimal"></div>
        <div><label>Temp Rem</label><input class="f-tb" type="number" inputmode="decimal"></div>
      </div>
      <div class="g2">
        <div><label>Tread L</label><input class="f-tl" type="number" inputmode="decimal"></div>
        <div><label>Tread R</label><input class="f-tx" type="number" inputmode="decimal"></div>
      </div>
      <label>Remark</label><input class="f-rm" type="text">
      <label>Foto (opsional)</label><input class="f-ph" type="file" accept="image/*">
    </div>`).join("");
  $("uAct").classList.remove("hide");
  recalc();
}

function recalc() {
  const hm = Number($("uh").value);
  document.querySelectorAll("#tyres .pos").forEach(c => {
    const ihu = c.dataset.ihu, iht = Number(c.dataset.iht);
    c.querySelector(".f-hm").value =
      ihu === "" || isNaN(hm) ? "" : Math.max(0, iht + (hm - Number(ihu)));
  });
}

function cancelUnit() {
  S.unit = null;
  $("tyres").innerHTML = ""; $("uAct").classList.add("hide");
  $("uu").value = ""; $("uh").value = ""; $("usug").classList.add("hide");
}

function compress(file, max = 1280, q = 0.7) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onerror = () => no(new Error("Foto gagal dibaca."));
    fr.onload = e => {
      const im = new Image();
      im.onerror = () => no(new Error("Foto tidak valid."));
      im.onload = () => {
        let w = im.width, h = im.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(im, 0, 0, w, h);
        ok(cv.toDataURL("image/jpeg", q));
      };
      im.src = e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

async function saveUnit() {
  if (!S.unit) return;
  const s = S.session, hm = Number($("uh").value);
  const num = v => v === "" ? "" : Number(v);
  const data = [];

  for (const c of document.querySelectorAll("#tyres .pos")) {
    const g = k => c.querySelector(k).value;
    const item = {
      date: s.date, unit: S.unit, hmUnit: hm,
      serialNumber: c.dataset.sn, position: c.dataset.pos, time: s.shift,
      hmTyre: g(".f-hm") === "" ? "" : Number(g(".f-hm")),
      pressureActual: num(g(".f-pa")), pressureAdd: num(g(".f-pd")),
      temperatureTyre: num(g(".f-tt")), temperatureRim: num(g(".f-tr")),
      temperatureBrake: num(g(".f-tb")),
      treadL: num(g(".f-tl")), treadR: num(g(".f-tx")),
      remark: g(".f-rm"), manpower: s.manpower
    };
    const f = c.querySelector(".f-ph").files[0];
    if (f) {
      try {
        item.photoData = await compress(f);
        item.photoName = item.serialNumber + "_" + s.date + "_" + Date.now() + "_" + item.position + ".jpg";
      } catch (e) { return toast(e.message); }
    }
    data.push(item);
  }

  await qPut({ unit: S.unit, date: s.date, shift: s.shift, status: "PENDING", error: "", data });
  s.saved++; await kvSet("session", s);
  toast(S.unit + " tersimpan di perangkat.");
  enterUnit();
  runQueue();
}

/* ---------- upload antrian ---------- */
async function runQueue(manual) {
  if (S.running) return;
  if (!navigator.onLine) { if (manual) toast("Tidak ada koneksi."); return; }
  if (!S.token) return;
  S.running = true;
  try {
    for (;;) {
      const x = (await qAll()).find(i => i.status === "PENDING");
      if (!x) break;
      x.status = "SENDING"; await qPut(x); renderQueue();
      try {
        await call("saveMonitoringData", [x.data]);
        await qDel(x.id);
        toast(x.unit + " terupload.");
      } catch (e) {
        if (isAuthErr(e) || e instanceof TypeError) {
          x.status = "PENDING"; await qPut(x);
          if (isAuthErr(e)) needLogin("Sesi habis. Login ulang, antrian akan dilanjutkan.");
          break;
        }
        x.status = "FAILED"; x.error = e.message; await qPut(x);
      }
      renderQueue();
    }
  } finally {
    S.running = false; renderQueue();
  }
}

/* ---------- mulai ---------- */
window.addEventListener("online", () => { netLabel(); runQueue(); });
window.addEventListener("offline", netLabel);

(async function init() {
  netLabel();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  S.token = (await kvGet("token")) || "";
  S.user = await kvGet("user");
  S.pkg = await kvGet("pkg");
  S.session = await kvGet("session");
  if (S.user && S.pkg) { show("sHome"); runQueue(); }
  else show("sLogin");
})();
</script>
</body>
</html>
